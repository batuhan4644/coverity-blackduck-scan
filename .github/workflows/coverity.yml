name: Coverity CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coverity:
    runs-on: [self-hosted, coverity]

    env:
      BRIDGE_COVERITY_PRCOMMENT_IMPACTS: High,Medium

    steps:

      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Coverity Scan
        id: coverity-scan
        uses: blackduck-inc/black-duck-security-scan@v2.11.0
        with:
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}

          coverity_project_name: coverity-blackduck-scan

          coverity_stream_name: ${{ github.event_name == 'pull_request' && format('coverity-blackduck-scan-{0}', github.base_ref) || format('coverity-blackduck-scan-{0}', github.ref_name) }}

          coverity_local: true

          coverity_clean_command: mvn -B clean
          coverity_build_command: mvn -B -DskipTests package

          # Full scan'de policy ihlali varsa pipeline'ı kırmak için aç
          # coverity_policy_view: ${{ github.event_name != 'pull_request' && 'Outstanding Issues' || '' }}

          coverity_prComment_enabled: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

          coverity_waitForScan: true